services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: seacorp_asset
      POSTGRES_USER: seacorp_asset_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}
    volumes:
      - seacorp_asset_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seacorp_asset_app -d seacorp_asset"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://seacorp_asset_app:${POSTGRES_PASSWORD}@db:5432/seacorp_asset
      DB_SCHEMA: seacorp_asset
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your .env}
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DATABASE_URL: postgresql+psycopg://seacorp_asset_app:${POSTGRES_PASSWORD}@db:5432/seacorp_asset
      DB_SCHEMA: seacorp_asset
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your .env}
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "frontend/app.py", "--server.address=0.0.0.0", "--server.port=8501"]

volumes:
  seacorp_asset_pgdata:
